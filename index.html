<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cultura Organizacional SKECHERS</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0055A4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.caja{
    background:white;
    width:380px;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    text-align:center;
}

h1{
    color:#0055A4;
}

input{
    width:90%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    width:95%;
    padding:15px;
    background:#0055A4;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#003d75;
}

</style>

</head>

<body>

<div class="caja">

<h1>👟 Cultura Organizacional SKECHERS</h1>

<p>Bienvenido</p>

<input type="text" placeholder="Nombre">

<input type="text" placeholder="CM">

<button>Ingresar</button>

</div>

</body>
</html>
